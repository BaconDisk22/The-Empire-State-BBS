name: Intel Mac test build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitdown-intel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-intel:
    name: Intel macOS app and DMG
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Verify Intel runner and Tk
        run: |
          test "$(uname -m)" = "x86_64"
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
      - name: Install application and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyserial pyinstaller pillow
      - name: Run unit tests
        run: |
          python -m compileall -q sitdown_desktop.py sitdown_monitor.py
          python -m unittest discover -s tests -p 'test_sitdown_*.py'
      - name: Generate Jersey app icon
        run: |
          python scripts/make_icon.py
          mkdir -p build/icon.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" build/sitdown-icon.png --out "build/icon.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" build/sitdown-icon.png --out "build/icon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns build/icon.iconset -o build/sitdown.icns
      - name: Package Intel Mac application
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir \
            --name "The Sitdown BBS" \
            --icon build/sitdown.icns \
            --add-data "example_config.ini:." \
            --collect-all meshtastic \
            --collect-all pubsub \
            sitdown_desktop.py
          test -d "dist/The Sitdown BBS.app"
          test "$(lipo -archs 'dist/The Sitdown BBS.app/Contents/MacOS/The Sitdown BBS')" = "x86_64"
      - name: Create unsigned test DMG
        run: |
          mkdir -p dmg-staging
          cp -R "dist/The Sitdown BBS.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "The Sitdown BBS TEST" \
            -srcfolder dmg-staging -ov -format UDZO "The-Sitdown-BBS-Intel-Test.dmg"
          shasum -a 256 "The-Sitdown-BBS-Intel-Test.dmg" > SHA256SUMS.txt
      - name: Upload downloadable test build
        uses: actions/upload-artifact@v4
        with:
          name: The-Sitdown-BBS-Intel-Mac-Test
          path: |
            The-Sitdown-BBS-Intel-Test.dmg
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
