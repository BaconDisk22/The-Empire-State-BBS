name: Refresh README desktop screenshot

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/images/desktop-preview-demo.png'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: empire-readme-screenshot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install screenshot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pillow pyserial
      - name: Capture real desktop preview in demo mode
        run: python scripts/capture_desktop_preview.py
      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: empire-desktop-demo-screenshot
          path: docs/images/desktop-preview-demo.png
          if-no-files-found: error
      - name: Open screenshot pull request
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCREENSHOT_PATHS: |
            docs/images/desktop-preview-demo.png
          CHECK_WORKFLOWS: |
            sitdown-checks.yml
            intel-mac-test-build.yml
        run: bash .github/scripts/open-screenshot-pr.sh

