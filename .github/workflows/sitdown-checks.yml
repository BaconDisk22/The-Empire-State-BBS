name: The Sitdown BBS checks
on:
  push:
    branches: [main, feature/the-sitdown-branding, feature/phase2-radio-monitoring]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: |
          python -m compileall -q \
            sitdown_desktop.py sitdown_commands.py sitdown_monitor.py \
            message_processing.py desktop_views.py desktop_session.py \
            radio_diagnostics.py radio_health.py tcp_health.py \
            config_init.py mail_outbox.py grapevine_protocol.py \
            empire_ui.py scripts/capture_ui_tour.py
          python -m compileall -q tests
      - name: Unit tests
        env:
          EMPIRE_GUI_TESTS: '1'
        run: xvfb-run -a python -m unittest discover -s tests -p 'test_*.py'
