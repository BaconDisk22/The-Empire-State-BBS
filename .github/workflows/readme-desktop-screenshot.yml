name: Refresh README desktop screenshot

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/images/desktop-preview-demo.png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitdown-readme-screenshot
  cancel-in-progress: true

jobs:
  capture:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install screenshot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pillow pyserial
      - name: Capture real desktop preview in demo mode
        run: python scripts/capture_desktop_preview.py
      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: sitdown-desktop-demo-screenshot
          path: docs/images/desktop-preview-demo.png
          if-no-files-found: error
      - name: Update README image on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/desktop-preview-demo.png
          if git diff --cached --quiet; then
            echo "Screenshot unchanged"
          else
            git commit -m "docs: refresh desktop demo screenshot [skip ci]"
            git push origin HEAD:main
          fi
